name: Deploy Docs

on:
    push:
        branches: [main]
    workflow_dispatch:

permissions:
    contents: read
    pages: write
    id-token: write

concurrency:
    group: pages
    # Let package replacement finish before another run starts.
    cancel-in-progress: false

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-python@v5
              with:
                  python-version: "3.12"

            - run: pip install -e .
            - run: zensical build

            # the docs search index the BEC MCP server loads from
            # https://bec-project.github.io/bec_docs/bec_docs_index.json.gz
            - name: Build the MCP docs search index
              run: python tools/build_mcp_docs_index.py . --name bec_docs --output site/bec_docs_index.json.gz

            - uses: actions/upload-pages-artifact@v3
              with:
                  path: site

    deploy:
        needs: build
        runs-on: ubuntu-latest
        environment:
            name: github-pages
        steps:
            - uses: actions/deploy-pages@v4

    mcp-docs-index-package:
        # Internal clients can download the index from the Gitea generic package registry:
        # https://gitea.psi.ch/api/packages/bec/generic/bec_docs_index/latest/bec_docs_index.json.gz
        if: github.ref == 'refs/heads/main'
        runs-on: ubuntu-latest
        permissions:
            contents: read
        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-python@v5
              with:
                  python-version: "3.12"

            - name: Build the MCP docs search index
              run: python tools/build_mcp_docs_index.py . --name bec_docs --output "$RUNNER_TEMP/index/bec_docs_index.json.gz"

            - name: Publish the index to the Gitea package registry
              env:
                  GITEA_REGISTRY_TOKEN: ${{ secrets.GITEA_REGISTRY_TOKEN }}
              run: bash tools/publish_mcp_docs_index.sh "$RUNNER_TEMP/index/bec_docs_index.json.gz"
