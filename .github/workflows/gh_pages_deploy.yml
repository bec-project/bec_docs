name: Deploy Docs

on:
    push:
        branches: [main]
    workflow_dispatch:

permissions:
    contents: read
    pages: write
    id-token: write

concurrency:
    group: pages
    cancel-in-progress: true

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-python@v5
              with:
                  python-version: "3.12"

            - run: pip install -e .
            - run: zensical build

            # the docs search index the BEC MCP server loads from
            # https://bec-project.github.io/bec_docs/bec_docs_index.json.gz
            - name: Build the MCP docs search index
              run: python tools/build_mcp_docs_index.py . --name bec_docs --output site/bec_docs_index.json.gz

            - uses: actions/upload-pages-artifact@v3
              with:
                  path: site

    deploy:
        needs: build
        runs-on: ubuntu-latest
        environment:
            name: github-pages
        steps:
            - uses: actions/deploy-pages@v4

    mcp-docs-index-branch:
        # git mirrors (e.g. an internal gitea) carry branches but not the Pages site, so the same
        # index is also the single commit of the mcp-docs-index branch, readable as a raw file
        runs-on: ubuntu-latest
        permissions:
            contents: write
        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-python@v5
              with:
                  python-version: "3.12"

            - name: Build the MCP docs search index
              run: python tools/build_mcp_docs_index.py . --name bec_docs --output "$RUNNER_TEMP/index/bec_docs_index.json.gz"

            - name: Replace the mcp-docs-index branch with one commit holding the index
              working-directory: ${{ runner.temp }}/index
              env:
                  TOKEN: ${{ github.token }}
              run: |
                  git init -q -b mcp-docs-index
                  git config user.name "github-actions[bot]"
                  git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
                  git add bec_docs_index.json.gz
                  git commit -q -m "chore: docs search index for ${GITHUB_SHA::7}"
                  git push -f "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" mcp-docs-index
